<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Ankapure Dhaba</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0d;
        color: white;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(360px, calc(100vw - 48px));
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 28px;
        object-fit: cover;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 20px;
        color: rgba(255, 255, 255, 0.68);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: #dc2626;
        color: white;
        padding: 0 20px;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/the-ankapure-dhaba-logo.png" alt="The Ankapure Dhaba" />
      <h1>The Ankapure Dhaba</h1>
      <p>Opening the live ordering app...</p>
      <a href="https://theankapurdhaba.com">Open App</a>
    </main>
  </body>
</html>
